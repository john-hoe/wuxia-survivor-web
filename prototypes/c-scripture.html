<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>翻阅秘籍 · 方向C 极简碑林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0a0f0c;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame {
    position:relative; width:960px; height:540px; overflow:hidden;
    background:#0d130e;
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 24px 80px rgba(0,0,0,.6);
  }
  /* ---------- 场景层 ---------- */
  .scene { position:absolute; inset:0; }
  .sky {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #18241b 0%, #101a13 46%, #0a100c 100%);
  }
  .gate {
    position:absolute; left:50%; top:64px; width:600px;
    transform:translateX(-50%);
    opacity:.85; filter:brightness(1.75);
  }
  .bamboo { position:absolute; bottom:-24px; height:560px; filter:brightness(.8); }
  .bamboo.l { left:-218px; }
  .bamboo.r { right:-218px; transform:scaleX(-1); }
  .bamboo.l2 { left:-150px; height:410px; bottom:-36px; opacity:.35; filter:brightness(.6); }
  .bamboo.r2 { right:-150px; height:410px; bottom:-36px; opacity:.35; filter:brightness(.6); transform:scaleX(-1); }
  .veil { position:absolute; inset:0; background:rgba(7,12,9,.65); }
  .mist {
    position:absolute; left:0; right:0; bottom:0; height:36%;
    background:linear-gradient(to top, rgba(238,241,234,.085) 0%, rgba(238,241,234,.03) 45%, rgba(238,241,234,0) 100%);
  }
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(90% 78% at 50% 44%, rgba(0,0,0,0) 52%, rgba(3,6,4,.55) 100%);
  }
  /* ---------- 内容层 ---------- */
  .content { position:absolute; inset:0; }
  .title-block { position:absolute; top:44px; left:0; right:0; text-align:center; }
  h1.title {
    display:inline-block; vertical-align:baseline;
    font-family:"Ma Shan Zheng",cursive; font-weight:400;
    font-size:48px; letter-spacing:.06em; color:#f4f1e6;
    text-shadow:0 1px 2px rgba(0,0,0,.45), 0 5px 22px rgba(0,0,0,.5);
  }
  .seal {
    display:inline-flex; vertical-align:baseline; margin-left:16px;
    width:24px; height:24px; border-radius:5px;
    background:linear-gradient(145deg,#c32323,#9c0f0f);
    color:#fdf6ec; font-family:"Ma Shan Zheng",cursive; font-size:14px;
    align-items:center; justify-content:center;
    transform:rotate(-4deg) translateY(-3px);
    box-shadow:0 1px 4px rgba(0,0,0,.55),
      inset 0 0 0 1.5px rgba(253,246,236,.9),
      inset 0 0 0 3px #a81212,
      inset 0 0 7px rgba(0,0,0,.35);
  }
  .tabs {
    position:absolute; top:126px; left:0; right:0;
    display:flex; justify-content:center; gap:64px;
  }
  .tab {
    position:relative;
    font-family:"Noto Serif SC",serif; font-weight:600;
    font-size:15px; letter-spacing:.24em; text-indent:.24em;
    color:rgba(240,234,216,.42);
  }
  .tab.on { font-size:16px; color:#f0ead8; }
  .tab .brush { position:absolute; left:4%; right:4%; bottom:-10px; width:92%; height:10px; }
  .info {
    position:absolute; top:170px; left:50%; transform:translateX(-50%);
    width:560px; display:flex; justify-content:space-between;
    font-size:12.5px; letter-spacing:.14em; color:rgba(255,255,255,.6);
  }
  .info b { font-weight:500; color:rgba(240,234,216,.88); font-variant-numeric:tabular-nums; }
  .drops { position:absolute; top:204px; left:50%; transform:translateX(-50%); width:560px; }
  .drop { display:flex; align-items:baseline; padding:12.5px 0; }
  .rarity { width:72px; font-family:"Ma Shan Zheng",cursive; font-size:20px; letter-spacing:.08em; }
  .rarity.c1 { color:#b8b3a4; }
  .rarity.c2 { color:#7d9b76; }
  .rarity.c3 { color:#a99a20; }
  .rarity.c4 { color:#c00000; text-shadow:0 0 12px rgba(192,0,0,.35); }
  .reward { font-size:12px; letter-spacing:.08em; color:rgba(255,255,255,.52); white-space:nowrap; }
  .dots { flex:1; margin:0 16px; border-bottom:1px dotted rgba(255,255,255,.26); transform:translateY(-4px); }
  .pct { width:52px; text-align:right; font-size:15px; font-weight:500; color:rgba(240,234,216,.88); font-variant-numeric:tabular-nums; }
  .fine {
    position:absolute; top:392px; left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:.16em; color:rgba(255,255,255,.42);
  }
  .actions { position:absolute; top:428px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .btn {
    position:relative;
    font-family:"Noto Serif SC",serif; font-weight:600;
    font-size:15px; letter-spacing:.22em; text-indent:.22em;
    color:rgba(240,234,216,.85);
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .btn .brush { position:absolute; left:5%; right:5%; bottom:-9px; width:90%; height:9px; opacity:.5; }
  .btn .brush path { fill:rgba(240,234,216,.55); }
  .btn.gold { font-size:17px; color:#c9b232; }
  .btn.gold .brush { opacity:1; height:11px; bottom:-10px; }
  .btn.gold .brush path { fill:#a99a20; }
  .back {
    position:absolute; left:36px; bottom:28px;
    font-size:13px; letter-spacing:.18em;
    color:rgba(255,255,255,.55);
  }
  .back span { margin-right:8px; }
</style>
</head>
<body>
<div class="frame">
  <div class="scene">
    <div class="sky"></div>
    <img class="bamboo l2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo r2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo l" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo r" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <div class="veil"></div>
    <div class="mist"></div>
    <div class="vignette"></div>
  </div>
  <div class="content">
    <div class="title-block">
      <h1 class="title">翻阅秘籍</h1><span class="seal">秘</span>
    </div>
    <div class="tabs">
      <div class="tab">局外成长</div>
      <div class="tab on">翻阅秘籍
        <svg class="brush" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 8.2 C 30 4.2, 64 9.8, 98 6.4 C 132 3.6, 168 8.2, 197 5.4 L 195.4 9.2 C 160 11.6, 118 8.2, 84 10.6 C 50 12.8, 20 10.4, 4.6 11.4 Z" fill="#a99a20"/>
        </svg>
      </div>
    </div>
    <div class="info">
      <div>铜钱 <b>0</b></div>
      <div>距保底 <b>20</b> 次</div>
    </div>
    <div class="drops">
      <div class="drop"><span class="rarity c1">普通</span><span class="reward">残页 / 铜钱返还</span><span class="dots"></span><span class="pct">65%</span></div>
      <div class="drop"><span class="rarity c2">精良</span><span class="reward">外观 / 成长碎片</span><span class="dots"></span><span class="pct">25%</span></div>
      <div class="drop"><span class="rarity c3">上乘</span><span class="reward">稀有心法碎片</span><span class="dots"></span><span class="pct">9%</span></div>
      <div class="drop"><span class="rarity c4">绝学</span><span class="reward">称号卷轴</span><span class="dots"></span><span class="pct">1%</span></div>
    </div>
    <div class="fine">20 次内至少 1 个精良或以上 · 重复收藏转为残页</div>
    <div class="actions">
      <div class="btn">翻阅一次 · 300 铜钱
        <svg class="brush" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 8.2 C 30 4.2, 64 9.8, 98 6.4 C 132 3.6, 168 8.2, 197 5.4 L 195.4 9.2 C 160 11.6, 118 8.2, 84 10.6 C 50 12.8, 20 10.4, 4.6 11.4 Z"/>
        </svg>
      </div>
      <div class="btn gold">翻阅十次 · 3000 铜钱
        <svg class="brush" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 8.2 C 30 4.2, 64 9.8, 98 6.4 C 132 3.6, 168 8.2, 197 5.4 L 195.4 9.2 C 160 11.6, 118 8.2, 84 10.6 C 50 12.8, 20 10.4, 4.6 11.4 Z"/>
        </svg>
      </div>
    </div>
    <div class="back"><span>←</span>返回</div>
  </div>
</div>
</body>
</html>
