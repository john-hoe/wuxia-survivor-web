<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向A · 设置</title>
<link rel="stylesheet" href="a-common.css">
<style>
  .set-panel{
    left:292px; top:62px; width:376px; height:424px;
    padding:50px 38px 16px;
    display:flex; flex-direction:column;
  }
  .set-plaque{ top:32px; }
  .set-plaque h1{ font-size:32px; letter-spacing:9px; padding-left:9px; }
  .set-plaque .seal{ width:22px; height:22px; font-size:13px; }

  .srow{
    display:flex; align-items:center; height:58px;
    border-bottom:1px solid rgba(26,31,26,.1);
  }
  .srow:last-of-type{ border-bottom:none; }
  .srow img.ic{ width:21px; height:21px; margin-right:13px; }
  .slabel{ flex:1; font:600 16px 'Noto Serif SC',serif; color:#242a21; letter-spacing:4px; }

  /* 滑杆：细墨线 + 玉色圆钮 */
  .slider{ position:relative; width:146px; height:2px; background:rgba(26,31,26,.26); border-radius:2px; margin-right:12px; }
  .slider .fill{
    position:absolute; left:0; top:0; bottom:0; border-radius:2px;
    background:linear-gradient(90deg,#86a07e,#6f9168);
  }
  .slider .knob{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #f0f6e8 0%, #b9d0ae 45%, #7fa077 80%, #5f8263 100%);
    box-shadow:0 0 0 1px rgba(26,31,26,.5), 0 1px 3px rgba(20,26,18,.4);
  }
  .sval{ width:27px; text-align:right; font:700 13px 'Noto Serif SC',serif; color:var(--body); }

  /* 开关：纸底墨框滑块 */
  .tgl{
    position:relative; width:46px; height:24px; border-radius:13px;
    border:1px solid rgba(26,31,26,.62);
    background:rgba(26,31,26,.05);
  }
  .tgl .tk{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fbf7ea, #ddd3b8 60%, #c2b694);
    box-shadow:0 0 0 1px rgba(26,31,26,.4), 0 1px 2px rgba(0,0,0,.25);
  }
  .tgl.on{ background:linear-gradient(160deg,#849e7c,#6a8963); border-color:rgba(26,31,26,.72); }
  .tgl.on .tk{
    left:24px;
    background:radial-gradient(circle at 35% 30%, #f6faee, #d2e2c5 55%, #a4bd97);
  }

  .set-panel .div{ margin:14px 4px 0; }
  .blink{
    align-self:center; margin-top:12px;
    font-size:13px; color:var(--sub); letter-spacing:6px; padding:0 4px 2px 10px;
    border-bottom:1px solid rgba(26,31,26,.32);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <div class="sky"></div>
    <img class="gate" src="../game/src/assets/backgrounds/distant_gate_shadow.png">
    <div class="ground"></div>
    <img class="bamboo b2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="bamboo b4" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="bamboo b1" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="bamboo b3" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <div class="vignette"></div>
  </div>

  <div class="panel set-panel">
    <span class="corner c-tl"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-tr"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-bl"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-br"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>

    <div class="srow">
      <img class="ic inkicon" src="../game/src/assets/ui/icon_music.png"><span class="slabel">音乐</span>
      <div class="slider"><span class="fill" style="width:60%"></span><span class="knob" style="left:60%"></span></div>
      <span class="sval">0.6</span>
    </div>
    <div class="srow">
      <img class="ic inkicon" src="../game/src/assets/ui/icon_sfx.png"><span class="slabel">音效</span>
      <div class="slider"><span class="fill" style="width:80%"></span><span class="knob" style="left:80%"></span></div>
      <span class="sval">0.8</span>
    </div>
    <div class="srow">
      <img class="ic inkicon" src="../game/src/assets/ui/icon_mute.png"><span class="slabel">静音</span>
      <div class="tgl on"><span class="tk"></span></div>
    </div>
    <div class="srow">
      <img class="ic inkicon" src="../game/src/assets/ui/icon_lowvfx.png"><span class="slabel">低特效</span>
      <div class="tgl"><span class="tk"></span></div>
    </div>
    <div class="srow">
      <img class="ic inkicon" src="../game/src/assets/ui/icon_fullscreen.png"><span class="slabel">全屏</span>
      <div class="tgl"><span class="tk"></span></div>
    </div>

    <div class="div"><i></i></div>
    <span class="blink">返回</span>
  </div>

  <div class="plaque set-plaque"><h1>设置</h1><span class="seal">设</span></div>
</div>
</body>
</html>
