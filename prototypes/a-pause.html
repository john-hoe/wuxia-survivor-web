<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向A · 暂停</title>
<link rel="stylesheet" href="a-common.css">
<style>
  /* ---------- 伪游戏画面 ---------- */
  .gscene{ position:absolute; inset:0; background:#0c130e; }
  .gscene .gground{
    position:absolute; inset:0;
    background:url('../game/src/assets/backgrounds/ground_qingshi_base.png') repeat;
    background-size:470px;
    filter:brightness(1.02);
  }
  .gscene .gshade{
    position:absolute; inset:0;
    background:radial-gradient(110% 90% at 50% 30%, rgba(20,32,22,.16) 0%, rgba(8,13,9,.46) 78%);
  }
  .gscene .ggate{ position:absolute; left:50%; top:58px; width:820px; transform:translateX(-50%); opacity:.5; }
  .gscene .gb{ position:absolute; }
  .gscene .gb.g1{ left:-64px; top:-30px; height:430px; opacity:.85; }
  .gscene .gb.g2{ right:-70px; top:-16px; height:450px; opacity:.85; transform:scaleX(-1); }
  .gscene .gb.g3{ left:180px; bottom:-40px; height:290px; opacity:.5; filter:brightness(.6); }
  .gscene .gb.g4{ right:190px; bottom:-56px; height:300px; opacity:.5; filter:brightness(.6); }

  .ghero{ position:absolute; left:182px; top:252px; width:128px; height:128px; overflow:hidden; transform:scale(1.2); transform-origin:bottom center; }
  .ghero img{ display:block; width:512px; height:128px; }
  .genemy{ position:absolute; width:96px; height:96px; overflow:hidden; }
  .genemy img{ display:block; width:384px; height:96px; }
  .genemy.e1{ left:664px; top:294px; transform:scale(1.05); transform-origin:bottom center; }
  .genemy.e2{ left:736px; top:196px; opacity:.92; }
  .genemy.e3{ left:56px; top:210px; opacity:.9; }
  .gsh{ position:absolute; width:84px; height:13px; border-radius:50%; background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.45), transparent 75%); }

  /* 伪 HUD */
  .ghud{ position:absolute; left:0; right:0; top:0; height:52px; display:flex; align-items:flex-start; justify-content:space-between; padding:12px 18px 0; }
  .ghud .left{ display:flex; align-items:center; gap:10px; }
  .ghud .lvl{
    width:36px; height:36px; border-radius:50%;
    border:2px solid rgba(200,178,90,.85);
    background:radial-gradient(circle at 40% 32%, #2b3529, #141b13 75%);
    color:#e8dfc0; font:700 17px 'Noto Serif SC',serif;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .ghud .hp{ width:138px; height:11px; border-radius:6px; border:1px solid rgba(200,178,90,.6); background:rgba(8,12,8,.7); overflow:hidden; }
  .ghud .hp i{ display:block; height:100%; width:72%; background:linear-gradient(90deg,#8aa383,#6f9070); }
  .ghud .right{ display:flex; align-items:center; gap:18px; padding-top:9px; }
  .ghud .rpair{ display:flex; align-items:center; gap:7px; }
  .ghud .rpair img{ width:17px; height:17px; }
  .ghud .rpair span{ color:#ddd5ba; font:700 14px 'Noto Serif SC',serif; text-shadow:0 1px 2px rgba(0,0,0,.6); }

  /* ---------- 压暗 ---------- */
  .dim{ position:absolute; inset:0; background:rgba(5,9,7,.4); backdrop-filter:blur(2px); }

  /* ---------- 暂停面板 ---------- */
  .pause-panel{
    left:330px; top:72px; width:300px; height:396px;
    padding:34px 30px 22px;
    display:flex; flex-direction:column; align-items:center;
  }
  .ptitle{ display:flex; align-items:center; gap:12px; }
  .ptitle h1{
    font-family:'Ma Shan Zheng',serif; font-weight:400;
    font-size:40px; letter-spacing:9px; padding-left:9px; color:#141a13; line-height:1;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .ptitle .seal{ width:24px; height:24px; font-size:14px; }

  .pause-panel .div{ width:100%; margin:17px 0 7px; }

  .prows{ width:100%; }
  .prow2{
    position:relative; height:50px;
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid rgba(26,31,26,.11);
  }
  .prow2:last-child{ border-bottom:none; }
  .ptxt{
    position:relative; z-index:2;
    font-family:'Ma Shan Zheng',serif; font-size:22px; letter-spacing:8px; padding-left:8px;
    color:#31362e; line-height:1;
  }
  .prow2.hot .ptxt{ color:#10150e; }
  .prow2.hot .ptxt::after{
    content:''; position:absolute; left:6%; right:6%; bottom:-5px; height:2px;
    background:linear-gradient(90deg,transparent,#a8912f 22%,#c9b356 50%,#a8912f 78%,transparent);
    border-radius:2px;
  }
  .prow2 .wash{
    position:absolute; left:50%; top:50%; z-index:1;
    width:190px; height:32px; transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(125,155,118,.26), rgba(125,155,118,0) 74%);
  }
  .prow2 .bi{ position:absolute; left:22px; top:50%; transform:translateY(-50%); z-index:2; }
</style>
</head>
<body>
<div class="stage">
  <div class="gscene">
    <div class="gground"></div>
    <img class="ggate" src="../game/src/assets/backgrounds/distant_gate_shadow.png">
    <img class="gb g3" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="gb g4" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="gb g1" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <img class="gb g2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png">
    <div class="gshade"></div>
    <div class="gsh" style="left:198px; top:382px; width:104px;"></div>
    <div class="ghero"><img src="../game/src/assets/sprites/hero_shaoxia_idle.png"></div>
    <div class="gsh" style="left:672px; top:380px; width:70px;"></div>
    <div class="genemy e1"><img src="../game/src/assets/sprites/enemy_bandit_grunt_walk.png"></div>
    <div class="genemy e2"><img src="../game/src/assets/sprites/enemy_bandit_grunt_walk.png"></div>
    <div class="genemy e3"><img src="../game/src/assets/sprites/enemy_bandit_grunt_walk.png"></div>
  </div>

  <div class="ghud">
    <div class="left">
      <div class="lvl">1</div>
      <div class="hp"><i></i></div>
    </div>
    <div class="right">
      <div class="rpair"><img src="../game/src/assets/ui/icon_hourglass.png"><span>0:06</span></div>
      <div class="rpair"><img src="../game/src/assets/ui/icon_kill.png"><span>2</span></div>
    </div>
  </div>

  <div class="dim"></div>

  <div class="panel pause-panel">
    <span class="corner c-tl"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-tr"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-bl"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>
    <span class="corner c-br"><svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="M31 3.5 H3.5 V31" stroke="#a8912f" stroke-width="2.3"/><path d="M22.5 9.5 H9.5 V22.5" stroke="#a8912f" stroke-width="1.6"/><path d="M16.5 14.5 H13.5 V17.5" stroke="#a8912f" stroke-width="1.3"/></svg></span>

    <div class="ptitle"><h1>暂停</h1><span class="seal">歇</span></div>

    <div class="div"><i></i></div>

    <div class="prows">
      <div class="prow2 hot"><span class="wash"></span><span class="bi"></span><span class="ptxt">继续</span></div>
      <div class="prow2"><span class="ptxt">重新开始</span></div>
      <div class="prow2"><span class="ptxt">回主菜单</span></div>
      <div class="prow2"><span class="ptxt">设置</span></div>
    </div>
  </div>
</div>
</body>
</html>
