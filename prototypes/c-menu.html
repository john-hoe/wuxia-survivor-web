<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>青石山道 · 主菜单 · 方向C 极简碑林</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0a0f0c;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame {
    position:relative; width:960px; height:540px; overflow:hidden;
    background:#0d130e;
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 24px 80px rgba(0,0,0,.6);
  }
  /* ---------- 场景层 ---------- */
  .scene { position:absolute; inset:0; }
  .sky {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #18241b 0%, #101a13 46%, #0a100c 100%);
  }
  .gate {
    position:absolute; left:50%; top:64px; width:600px;
    transform:translateX(-50%);
    opacity:.85;
    filter:brightness(1.75);
  }
  .bamboo { position:absolute; bottom:-24px; height:560px; filter:brightness(.8); }
  .bamboo.l { left:-218px; }
  .bamboo.r { right:-218px; transform:scaleX(-1); }
  .bamboo.l2 { left:-150px; height:410px; bottom:-36px; opacity:.35; filter:brightness(.6); }
  .bamboo.r2 { right:-150px; height:410px; bottom:-36px; opacity:.35; filter:brightness(.6); transform:scaleX(-1); }
  .veil { position:absolute; inset:0; background:rgba(7,12,9,.65); }
  .mist {
    position:absolute; left:0; right:0; bottom:0; height:36%;
    background:linear-gradient(to top, rgba(238,241,234,.085) 0%, rgba(238,241,234,.03) 45%, rgba(238,241,234,0) 100%);
  }
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(90% 78% at 50% 44%, rgba(0,0,0,0) 52%, rgba(3,6,4,.55) 100%);
  }
  /* ---------- 内容层 ---------- */
  .content { position:absolute; inset:0; }
  .stats {
    position:absolute; top:30px; left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:.22em; color:rgba(255,255,255,.6);
    font-weight:400;
  }
  .stats b { font-weight:500; color:rgba(240,234,216,.85); }
  .title-block { position:absolute; top:96px; left:0; right:0; text-align:center; }
  h1.title {
    font-family:"Ma Shan Zheng",cursive; font-weight:400;
    font-size:72px; letter-spacing:.06em; color:#f4f1e6;
    text-shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 26px rgba(0,0,0,.5);
  }
  .seal {
    position:absolute; left:calc(50% + 128px); top:98px;
    width:27px; height:27px; border-radius:6px;
    background:linear-gradient(145deg,#c32323,#9c0f0f);
    color:#fdf6ec; font-family:"Ma Shan Zheng",cursive; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-4deg);
    box-shadow:0 1px 4px rgba(0,0,0,.55),
      inset 0 0 0 1.5px rgba(253,246,236,.9),
      inset 0 0 0 3.5px #a81212,
      inset 0 0 8px rgba(0,0,0,.35);
  }
  .menu { position:absolute; top:226px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:30px; }
  .mi {
    position:relative;
    font-family:"Noto Serif SC",serif; font-weight:600;
    font-size:28px; letter-spacing:.34em; text-indent:.34em;
    color:#f0ead8;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .mi.dim { color:rgba(240,234,216,.78); }
  .mi.primary { transform:scale(1.03); transform-origin:center; }
  .mi.primary .brush { opacity:1; }
  .brush {
    position:absolute; left:6%; right:6%; bottom:-12px; height:12px; width:88%;
    opacity:0; pointer-events:none;
  }
  .hero-wrap {
    position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    width:128px; height:128px; overflow:hidden;
  }
  .hero-wrap img { width:512px; height:128px; display:block; }
  .hero-shadow {
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:96px; height:14px; border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,0));
  }
</style>
</head>
<body>
<div class="frame">
  <div class="scene">
    <div class="sky"></div>
    <img class="bamboo l2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo r2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo l" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo r" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <div class="veil"></div>
    <div class="mist"></div>
    <div class="vignette"></div>
  </div>
  <div class="content">
    <div class="stats">铜钱 <b>0</b> &nbsp;·&nbsp; 最高存活 <b>0s</b> &nbsp;·&nbsp; 最高击杀 <b>0</b></div>
    <div class="title-block">
      <h1 class="title">青石山道</h1>
      <div class="seal">侠</div>
    </div>
    <nav class="menu">
      <div class="mi primary">开始闯荡
        <svg class="brush" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 8.2 C 30 4.2, 64 9.8, 98 6.4 C 132 3.6, 168 8.2, 197 5.4 L 195.4 9.2 C 160 11.6, 118 8.2, 84 10.6 C 50 12.8, 20 10.4, 4.6 11.4 Z" fill="#a99a20"/>
        </svg>
      </div>
      <div class="mi dim">翻阅秘籍</div>
      <div class="mi dim">设置</div>
    </nav>
    <div class="hero-shadow"></div>
    <div class="hero-wrap"><img src="../game/src/assets/sprites/hero_shaoxia_idle.png" alt="少侠"></div>
  </div>
</div>
</body>
</html>
