<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动画陈列室 · 武侠幸存者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-bg:#0a0f0c;
    --ink-panel:#101713;
    --ink-panel-2:#0d1310;
    --line:rgba(190,210,185,.09);
    --line-strong:rgba(190,210,185,.16);
    --text:#cfd8c8;
    --text-dim:#7d8a78;
    --text-faint:#57624f;
    --cinnabar:#b23a2c;
    --cinnabar-deep:#8e2b20;
    --gold:#c2a367;
    --jade:#7ba889;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--ink-bg);}
  body{
    font-family:"Noto Serif SC",serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(60,90,66,.14), transparent 60%),
      var(--ink-bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ── 两侧竹影（极淡） ───────────────────── */
  .bamboo{
    position:fixed;top:0;bottom:0;width:min(26vw,340px);
    pointer-events:none;z-index:0;
    background-image:url("../game/src/assets/backgrounds/bamboo_edge_cluster.png");
    background-repeat:repeat-y;
    background-size:100% auto;
    opacity:.07;
    filter:saturate(.6) brightness(.8);
  }
  .bamboo.left{left:0;background-position:left top;
    -webkit-mask-image:linear-gradient(to right,#000 30%,transparent 100%);
            mask-image:linear-gradient(to right,#000 30%,transparent 100%);}
  .bamboo.right{right:0;transform:scaleX(-1);background-position:left top;
    -webkit-mask-image:linear-gradient(to right,#000 30%,transparent 100%);
            mask-image:linear-gradient(to right,#000 30%,transparent 100%);}

  .wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:64px 48px 96px;}

  /* ── 碑额 ───────────────────── */
  header{text-align:center;margin-bottom:72px;position:relative;}
  .eyebrow{
    font-size:12px;letter-spacing:.55em;color:var(--text-faint);
    text-transform:uppercase;margin-bottom:18px;padding-left:.55em;
  }
  h1{
    font-family:"Ma Shan Zheng","Noto Serif SC",serif;
    font-weight:400;
    font-size:clamp(44px,6vw,76px);
    color:#e6ecd9;
    letter-spacing:.14em;
    text-shadow:0 2px 30px rgba(120,160,110,.15);
  }
  .seal{
    display:inline-flex;align-items:center;justify-content:center;
    width:54px;height:54px;margin-left:18px;vertical-align:.1em;
    background:linear-gradient(145deg,var(--cinnabar),var(--cinnabar-deep));
    border-radius:8px;
    font-family:"Ma Shan Zheng",serif;font-size:32px;color:#f3e6da;
    box-shadow:0 3px 14px rgba(178,58,44,.35), inset 0 0 0 2px rgba(243,230,218,.25);
    transform:rotate(-4deg);
    user-select:none;
  }
  .subtitle{
    margin-top:20px;font-size:14px;color:var(--text-dim);letter-spacing:.28em;padding-left:.28em;
  }
  .header-rule{
    width:220px;height:1px;margin:34px auto 0;
    background:linear-gradient(to right,transparent,var(--line-strong),transparent);
  }
  .source-note{
    margin-top:16px;font-size:11px;color:var(--text-faint);letter-spacing:.12em;
  }
  .source-note code{color:var(--gold);font-size:11px;}

  /* ── 分区 ───────────────────── */
  section{margin-bottom:84px;}
  .section-head{
    display:flex;align-items:baseline;gap:18px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:40px;
  }
  .section-head h2{
    font-family:"Ma Shan Zheng",serif;font-weight:400;
    font-size:30px;color:var(--gold);letter-spacing:.2em;
  }
  .section-head .count{font-size:12px;color:var(--text-faint);letter-spacing:.2em;}
  .section-head .en{
    margin-left:auto;font-size:11px;color:var(--text-faint);
    letter-spacing:.3em;text-transform:uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:44px 36px;
  }
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(560px,1fr));}
  @media (max-width:640px){
    .wrap{padding:40px 18px 64px;}
    .grid,.grid.wide{grid-template-columns:1fr;}
  }

  /* ── 卡片 ───────────────────── */
  .card{
    background:linear-gradient(170deg,var(--ink-panel),var(--ink-panel-2));
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    transition:border-color .3s ease, transform .3s ease;
  }
  .card:hover{border-color:var(--line-strong);transform:translateY(-2px);}
  .card-head{
    display:flex;align-items:center;gap:12px;
    padding:16px 20px 0;
  }
  .card-head .name{
    font-family:"Ma Shan Zheng",serif;font-size:22px;color:#dde6d2;letter-spacing:.1em;
  }
  .badge{
    font-size:10px;letter-spacing:.18em;padding:3px 8px 2px;
    border-radius:3px;border:1px solid;
  }
  .badge.loop{color:var(--jade);border-color:rgba(123,168,137,.4);background:rgba(123,168,137,.08);}
  .badge.once{color:var(--gold);border-color:rgba(194,163,103,.4);background:rgba(194,163,103,.08);}
  .badge.warn{color:#d98c7a;border-color:rgba(217,140,122,.45);background:rgba(217,140,122,.08);}

  .stage{
    position:relative;margin:14px 20px 0;
    display:flex;align-items:center;justify-content:center;
    min-height:120px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    background-color:#0b100d;
  }
  /* 青石板纹理垫底（低透明） */
  .stage::before{
    content:"";position:absolute;inset:0;
    background-image:url("../game/src/assets/backgrounds/ground_qingshi_base.png");
    background-size:256px 256px;
    opacity:.14;
    filter:saturate(.7) brightness(.9);
  }
  .stage canvas{
    position:relative;z-index:1;display:block;
    image-rendering:auto;
  }
  .stage .zoom-tag{
    position:absolute;right:8px;bottom:6px;z-index:2;
    font-size:10px;color:var(--text-faint);letter-spacing:.15em;
  }
  .stage .frame-tag{
    position:absolute;left:8px;bottom:6px;z-index:2;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;color:var(--text-faint);letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
  }

  .specs{
    padding:14px 20px 18px;
    font-size:12px;color:var(--text-dim);
    display:flex;flex-wrap:wrap;gap:6px 0;
  }
  .specs .row{width:100%;display:flex;gap:8px;align-items:baseline;}
  .specs .id{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;color:var(--text-faint);
    word-break:break-all;
  }
  .specs .nums{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;color:#a7b39c;letter-spacing:.02em;
  }
  .specs .nums b{color:#d5decb;font-weight:600;}
  .specs .upgrade{
    font-size:10.5px;color:var(--gold);letter-spacing:.08em;
  }

  footer{
    margin-top:40px;text-align:center;
    font-size:11px;color:var(--text-faint);letter-spacing:.25em;
  }
</style>
</head>
<body>
<div class="bamboo left"></div>
<div class="bamboo right"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">Wuxia Survivor · Sprite Review</div>
    <h1>动画陈列室<span class="seal">阅</span></h1>
    <div class="subtitle">逐 帧 检 阅 · 三 倍 放 大 · 与 游 戏 规 格 同 源</div>
    <div class="header-rule"></div>
    <div class="source-note" id="sourceNote">规格来源检测中…</div>
  </header>

  <main id="main"></main>

  <footer>武 侠 幸 存 者 · 美 术 自 审 工 具</footer>
</div>

<script>
/* ================================================================
 * 规格数据：优先 fetch 解析 ../game/src/data/artManifest.ts，
 * file:// 下 fetch 受 CORS 限制时回退到下方内置常量。
 * 内置常量集中此处（MANIFEST_FALLBACK），素材升级后只需更新这一段，
 * 或直接以 http(s) 方式打开本页即可实时解析最新 manifest。
 * ================================================================ */
const MANIFEST_URL = "../game/src/data/artManifest.ts";
const ASSET_BASE   = "../game/src/assets/";

/* 与 artManifest.ts 同步的内置回退（最近核对：帧尺寸×帧数 = 实际图集尺寸） */
const MANIFEST_FALLBACK = {
  hero_shaoxia_idle:              { path:"sprites/hero_shaoxia_idle.png",              width:256, height:256, frames:4, frameRate:6,  loop:true  },
  hero_shaoxia_move:              { path:"sprites/hero_shaoxia_move.png",              width:256, height:256, frames:6, frameRate:10, loop:true  },
  hero_shaoxia_hurt:              { path:"sprites/hero_shaoxia_hurt.png",              width:256, height:256, frames:2, frameRate:12, loop:true  },
  enemy_bandit_grunt_walk:        { path:"sprites/enemy_bandit_grunt_walk.png",        width:192, height:192, frames:4, frameRate:8,  loop:true  },
  enemy_hound_run:                { path:"sprites/enemy_hound_run.png",                width:192, height:192, frames:4, frameRate:10, loop:true  },
  enemy_shield_bandit_walk:       { path:"sprites/enemy_shield_bandit_walk.png",       width:256, height:256, frames:4, frameRate:8,  loop:true  },
  enemy_maple_bandit_walk:        { path:"sprites/enemy_maple_bandit_walk.png",        width:192, height:192, frames:4, frameRate:8,  loop:true  },
  enemy_maple_wolf_run:           { path:"sprites/enemy_maple_wolf_run.png",           width:192, height:192, frames:4, frameRate:10, loop:true  },
  enemy_maple_shield_walk:        { path:"sprites/enemy_maple_shield_walk.png",        width:256, height:256, frames:4, frameRate:8,  loop:true  },
  enemy_wooden_dummy_elite_walk:  { path:"sprites/enemy_wooden_dummy_elite_walk.png",  width:352, height:352, frames:4, frameRate:7,  loop:true  },
  boss_heifeng_idle:              { path:"sprites/boss_heifeng_idle.png",              width:416, height:416, frames:4, frameRate:5,  loop:true  },
  boss_heifeng_attack:            { path:"sprites/boss_heifeng_attack.png",            width:416, height:416, frames:6, frameRate:8,  loop:false },
  vfx_enemy_die:                  { path:"vfx/vfx_enemy_die.png",                      width:96,  height:96,  frames:6, frameRate:24, loop:false },
  vfx_ink_splat:                  { path:"vfx/vfx_ink_splat.png",                      width:96,  height:96,  frames:6, frameRate:18, loop:false },
  skill_yulong_projectile:        { path:"vfx/skill_yulong_projectile.png",            width:96,  height:32,  frames:4, frameRate:18, loop:true  }
};

/* 陈列清单：分区 + 中文名（名称按游戏内称谓，规格数字一律取自 manifest 解析/回退） */
const SHOWLIST = [
  { title:"主 角", en:"Hero", wide:false, items:[
    { id:"hero_shaoxia_idle", cn:"少侠 · 待机" },
    { id:"hero_shaoxia_move", cn:"少侠 · 移动" },
    { id:"hero_shaoxia_hurt", cn:"少侠 · 受伤" },
  ]},
  { title:"敌 人", en:"Enemies", wide:false, items:[
    { id:"enemy_bandit_grunt_walk",       cn:"山贼喽啰 · 行走" },
    { id:"enemy_hound_run",               cn:"恶犬 · 奔跑"     },
    { id:"enemy_shield_bandit_walk",      cn:"持盾山贼 · 行走" },
    { id:"enemy_wooden_dummy_elite_walk", cn:"木人机关 · 精英" },
  ]},
  { title:"枫叶官道 · 敌", en:"Maple Enemies", wide:false, items:[
    { id:"enemy_maple_bandit_walk", cn:"官道响马 · 行走" },
    { id:"enemy_maple_wolf_run",    cn:"灰褐野狼 · 奔跑" },
    { id:"enemy_maple_shield_walk", cn:"镖局叛卒 · 行走" },
  ]},
  { title:"寨 主", en:"Boss", wide:true, items:[
    { id:"boss_heifeng_idle",   cn:"黑风寨主 · 待机" },
    { id:"boss_heifeng_attack", cn:"黑风寨主 · 攻击" },
  ]},
  { title:"特 效", en:"VFX & Skill", wide:false, items:[
    { id:"vfx_enemy_die",           cn:"山贼 · 死亡消散" },
    { id:"vfx_ink_splat",           cn:"墨染江山 · 溅墨" },
    { id:"skill_yulong_projectile", cn:"游龙剑气 · 弹体" },
  ]},
];

const ZOOM = 3;              /* 三倍放大 */
const ONCE_PAUSE_MS = 600;   /* 单次播放播完后停顿 */

/* ---------- manifest 解析 ---------- */
function parseManifestTS(src){
  const out = {};
  /* 逐条匹配 { id: "...", ... } 对象块（条目内无嵌套花括号） */
  const re = /\{\s*id:\s*"([^"]+)"([\s\S]*?)\n\s*\},/g;
  let m;
  while ((m = re.exec(src)) !== null){
    const id = m[1], body = m[2];
    const grab = (k) => {
      const r = new RegExp(k + ':\\s*"([^"]+)"').exec(body);
      return r ? r[1] : null;
    };
    const grabN = (k) => {
      const r = new RegExp(k + ":\\s*(\\d+)").exec(body);
      return r ? parseInt(r[1], 10) : null;
    };
    const loopM = /loop:\s*(false|true)/.exec(body);
    out[id] = {
      path:      grab("path"),
      width:     grabN("width"),
      height:    grabN("height"),
      frames:    grabN("frames")  || 1,
      frameRate: grabN("frameRate") || 0,
      loop:      loopM ? loopM[1] === "true" : true,
    };
  }
  return out;
}

async function loadSpecs(){
  try{
    const res = await fetch(MANIFEST_URL, { cache:"no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const parsed = parseManifestTS(await res.text());
    const need = SHOWLIST.flatMap(s => s.items.map(i => i.id));
    const ok = need.every(id => parsed[id] && parsed[id].path && parsed[id].width);
    if (!ok) throw new Error("manifest 解析缺条目");
    return { specs: parsed, source: "live" };
  }catch(e){
    return { specs: MANIFEST_FALLBACK, source: "fallback", reason: String(e) };
  }
}

/* ---------- 动画播放器 ---------- */
const players = [];

function makePlayer(canvas, img, spec, frameTag){
  const ctx = canvas.getContext("2d");
  /* 源帧宽以实际图集为准（素材若已升级 2× 也能正确切帧） */
  const srcFrameW = Math.round(img.naturalWidth  / spec.frames);
  const srcFrameH = img.naturalHeight;
  canvas.width  = srcFrameW * ZOOM;
  canvas.height = srcFrameH * ZOOM;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const p = {
    spec, canvas, ctx, img, srcFrameW, srcFrameH, frameTag,
    t: 0, holdUntil: 0,
    tick(now, dt){
      const fps = spec.frameRate || 1;
      if (now < this.holdUntil) return;
      this.t += dt;
      const total = spec.frames;
      let frame = Math.floor(this.t * fps);
      if (spec.loop){
        frame = frame % total;
      } else if (frame >= total){
        /* 单次播放：停在末帧 600ms 后重播 */
        this.holdUntil = now + ONCE_PAUSE_MS;
        this.t = 0;
        frame = total - 1;
      }
      this.draw(frame);
    },
    draw(frame){
      const { ctx, img, srcFrameW, srcFrameH, canvas } = this;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(
        img,
        frame * srcFrameW, 0, srcFrameW, srcFrameH,
        0, 0, canvas.width, canvas.height
      );
      if (this.frameTag){
        const label = "帧 " + (frame + 1) + "/" + spec.frames;
        if (this.frameTag.textContent !== label) this.frameTag.textContent = label;
      }
    }
  };
  p.draw(0);
  return p;
}

let lastNow = 0;
function raf(now){
  const dt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  for (const p of players) p.tick(now, dt);
  requestAnimationFrame(raf);
}

/* ---------- 渲染页面 ---------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildCard(item, spec){
  const card = el("article", "card");

  const head = el("div", "card-head");
  head.appendChild(el("span", "name", item.cn));
  head.appendChild(el("span", "badge " + (spec.loop ? "loop" : "once"), spec.loop ? "循环" : "单次"));
  card.appendChild(head);

  const stage = el("div", "stage");
  const canvas = document.createElement("canvas");
  const dispW = spec.width * ZOOM, dispH = spec.height * ZOOM;
  canvas.style.width  = Math.min(dispW, 640) + "px";
  canvas.style.height = "auto";
  canvas.style.maxWidth = "100%";
  stage.appendChild(canvas);
  stage.appendChild(el("span", "zoom-tag", "×" + ZOOM));
  const frameTag = el("span", "frame-tag", "帧 -/" + spec.frames);
  stage.appendChild(frameTag);
  card.appendChild(stage);

  const specs = el("div", "specs");
  const r1 = el("div", "row");
  r1.appendChild(el("span", "id", spec.path));
  specs.appendChild(r1);
  const r2 = el("div", "row");
  const nums = el("span", "nums");
  nums.innerHTML =
    "<b>" + spec.frames + "</b> 帧 · <b>" + spec.frameRate + "</b> fps · 帧尺寸 <b>" +
    spec.width + "×" + spec.height + "</b> · 图集 " + (spec.width * spec.frames) + "×" + spec.height;
  specs.appendChild(r2).appendChild(nums);
  const r3 = el("div", "row");
  const up = el("span", "upgrade", "");
  r3.appendChild(up);
  specs.appendChild(r3);
  card.appendChild(specs);

  /* 载入图集，校验实际尺寸是否与规格一致（检测 2× 升级） */
  const img = new Image();
  img.onload = () => {
    const actualFramesW = img.naturalWidth;
    const expectW = spec.width * spec.frames;
    if (actualFramesW === expectW * 2 && img.naturalHeight === spec.height * 2){
      up.textContent = "⚑ 素材已升级 2×（实际 " + actualFramesW + "×" + img.naturalHeight + "），按实际尺寸切帧";
      head.appendChild(el("span", "badge once", "2×"));
    } else if (actualFramesW !== expectW || img.naturalHeight !== spec.height){
      up.textContent = "⚠ 图集实际 " + actualFramesW + "×" + img.naturalHeight + " 与规格不符，按实际宽度均分切帧";
      head.appendChild(el("span", "badge warn", "规格不符"));
    } else {
      r3.remove();
    }
    players.push(makePlayer(canvas, img, spec, frameTag));
  };
  img.onerror = () => {
    up.textContent = "⚠ 图集缺失：" + spec.path;
    head.appendChild(el("span", "badge warn", "缺图"));
  };
  img.src = ASSET_BASE + spec.path;

  return card;
}

async function init(){
  const { specs, source, reason } = await loadSpecs();
  const note = document.getElementById("sourceNote");
  if (source === "live"){
    note.innerHTML = "规格来源：<code>artManifest.ts</code> 实时解析 · 与游戏一致";
  } else {
    note.innerHTML = "规格来源：内置常量（file:// 下无法读取 <code>artManifest.ts</code>" +
      (reason ? " · " + reason : "") + "），如需实时解析请经 http 访问";
  }

  const main = document.getElementById("main");
  for (const section of SHOWLIST){
    const sec = el("section");
    const sh = el("div", "section-head");
    sh.appendChild(el("h2", null, section.title));
    sh.appendChild(el("span", "count", "共 " + section.items.length + " 式"));
    sh.appendChild(el("span", "en", section.en));
    sec.appendChild(sh);

    const grid = el("div", "grid" + (section.wide ? " wide" : ""));
    for (const item of section.items){
      const spec = specs[item.id];
      if (!spec) continue;
      grid.appendChild(buildCard(item, spec));
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }
  requestAnimationFrame((t) => { lastNow = t; requestAnimationFrame(raf); });
}

init();
</script>
</body>
</html>
