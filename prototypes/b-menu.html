<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>青石山道 · 主菜单 · 方向B 夜山客栈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0a0f0c;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans SC',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage {
    width:960px; height:540px; position:relative; overflow:hidden;
    background:linear-gradient(180deg,#0c1310 0%,#0e1613 42%,#070c0a 100%);
  }

  /* ============ 场景层 · 夜山 ============ */
  .scene { position:absolute; inset:0; }
  .moon-glow {
    position:absolute; left:-120px; top:-160px; width:460px; height:420px;
    background:radial-gradient(circle, rgba(168,196,182,.07), transparent 65%);
  }
  .gate {
    position:absolute; left:130px; bottom:38px; width:700px;
    opacity:.38; filter:brightness(1.9) saturate(.5) blur(.6px);
  }
  .bamboo { position:absolute; bottom:0; height:500px; filter:brightness(.46) saturate(.75) contrast(1.06); }
  .bamboo.bl { left:-58px; }
  .bamboo.br { right:-58px; transform:scaleX(-1); }
  .bamboo.bl2 { left:120px; height:330px; opacity:.5; filter:brightness(.34) saturate(.7) blur(1px); }
  .bamboo.br2 { right:120px; height:330px; opacity:.5; transform:scaleX(-1); filter:brightness(.34) saturate(.7) blur(1px); }

  .ground {
    position:absolute; left:0; right:0; bottom:0; height:56px;
    background:url('../game/src/assets/backgrounds/ground_qingshi_base.png') repeat-x;
    background-size:auto 300px; background-position:center top;
    filter:brightness(.58) saturate(.85);
  }
  .ground::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,9,7,.85), rgba(5,9,7,.15) 45%, rgba(5,9,7,.45));
    box-shadow:inset 0 1px 0 rgba(232,217,160,.05);
  }

  /* 灯笼与暖光 */
  .lamp-glow {
    position:absolute; right:-40px; top:-140px; width:560px; height:520px;
    background:radial-gradient(circle at 62% 32%, rgba(212,160,90,.13), rgba(212,160,90,.05) 42%, transparent 68%);
  }
  .lantern {
    position:absolute; right:74px; top:2px; height:92px;
    filter:brightness(.95) drop-shadow(0 0 18px rgba(212,120,50,.45));
  }
  .firefly { position:absolute; width:3px; height:3px; border-radius:50%;
    background:#e8d9a0; box-shadow:0 0 6px 1px rgba(232,217,160,.5); }

  /* 整体压暗 + 暗角 */
  .shade { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,10,8,.5), rgba(6,10,8,.12) 30%, rgba(6,10,8,.2) 68%, rgba(4,8,6,.55)); }
  .vignette { position:absolute; inset:0;
    background:radial-gradient(ellipse 78% 72% at 50% 46%, transparent 52%, rgba(3,6,5,.6)); }

  /* ============ 面板 · 三层结构 ============ */
  .panel {
    position:absolute; left:180px; top:26px; width:600px; height:404px;
    background:linear-gradient(180deg,#1b2620 0%,#16201a 34%,#111a15 100%);
    border:1px solid rgba(216,201,144,.42);
    box-shadow:0 24px 60px rgba(0,0,0,.62), 0 0 90px rgba(212,160,90,.06),
               inset 0 0 40px rgba(0,0,0,.25);
  }
  .panel::before {
    content:''; position:absolute; inset:5px;
    border:1px solid rgba(216,201,144,.13); pointer-events:none;
  }
  .corner { position:absolute; width:20px; height:20px; z-index:3; }
  .corner.tl { top:6px; left:6px; }
  .corner.tr { top:6px; right:6px; transform:rotate(90deg); }
  .corner.br { bottom:6px; right:6px; transform:rotate(180deg); }
  .corner.bl { bottom:6px; left:6px; transform:rotate(270deg); }

  .jade-pin {
    position:absolute; left:50%; top:-5px; width:9px; height:9px; z-index:4;
    transform:translateX(-50%) rotate(45deg);
    background:radial-gradient(circle at 35% 30%, #d8ecdc, #7ba086 72%);
    border:1px solid rgba(216,201,144,.85);
    box-shadow:0 0 7px rgba(155,190,165,.55), 0 1px 3px rgba(0,0,0,.5);
  }

  .side-tag {
    position:absolute; left:-32px; top:96px;
    writing-mode:vertical-rl; letter-spacing:8px;
    font:600 11px 'Noto Serif SC',serif; color:rgba(216,201,144,.6);
  }
  .side-tag::before {
    content:''; display:block; width:4px; height:4px; margin:0 auto 10px;
    transform:rotate(45deg); background:rgba(216,201,144,.45);
  }
  .side-tag::after {
    content:''; display:block; width:1px; height:34px; margin:10px auto 0;
    background:linear-gradient(180deg, rgba(216,201,144,.4), transparent);
  }

  /* 额枋标题区 */
  .lintel {
    position:relative; height:64px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#131b16,#101713);
    border-bottom:1px solid rgba(232,217,160,.38);
    box-shadow:0 1px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(232,217,160,.06);
    gap:18px; padding:0 26px;
  }
  .lintel .ll { flex:1; max-width:118px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(216,201,144,.55)); }
  .lintel .ll.r { background:linear-gradient(270deg, transparent, rgba(216,201,144,.55)); }
  .lintel h1 {
    font:400 35px 'Ma Shan Zheng','Noto Serif SC',serif;
    color:#d8c990; letter-spacing:6px; line-height:1;
    text-shadow:0 0 14px rgba(212,160,90,.28), 0 2px 4px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  .seal {
    width:25px; height:25px; border-radius:4px; flex:none;
    background:linear-gradient(155deg,#b4342a,#8a211a);
    color:#f2e8dd; font:400 14px/25px 'Ma Shan Zheng',serif; text-align:center;
    transform:rotate(-5deg) translateY(1px);
    box-shadow:inset 0 0 5px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.5);
  }

  /* ============ 统计凹井 ============ */
  .well {
    background:linear-gradient(180deg,#0c1310,#0e1512);
    border:1px solid rgba(0,0,0,.55);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.72), inset 0 -1px 0 rgba(0,0,0,.35),
               0 1px 0 rgba(232,217,160,.06);
    border-radius:3px;
  }
  .stats {
    margin:12px 24px 0; height:58px;
    display:flex; align-items:stretch;
  }
  .flourish {
    display:block; margin:10px auto 0; width:220px; height:14px;
    opacity:.55;
  }
  .stat { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; }
  .stat + .stat { border-left:1px solid rgba(216,201,144,.1); }
  .stat img { width:19px; height:19px; opacity:.9; }
  .stat .meta { display:flex; flex-direction:column; gap:3px; }
  .stat .lab { font:500 10px 'Noto Sans SC'; color:rgba(200,194,178,.68); letter-spacing:3px; }
  .stat .num { font:600 17px 'Noto Serif SC'; color:#e8d9a0; font-variant-numeric:tabular-nums; line-height:1;
    text-shadow:0 0 8px rgba(212,160,90,.2); }

  /* ============ 菜单行 ============ */
  .rows { margin:8px 24px 0; border-top:1px solid rgba(216,201,144,.09); }
  .row {
    position:relative; height:56px; display:flex; align-items:center; justify-content:center;
    gap:14px; border-bottom:1px solid rgba(216,201,144,.09);
  }
  .row img { width:21px; height:21px; opacity:.85; }
  .row span {
    font:600 20px 'Noto Serif SC'; color:#efe8d5; letter-spacing:10px; text-indent:10px;
    text-shadow:0 1px 3px rgba(0,0,0,.55);
  }
  .row .jade-bar {
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:3px; height:20px; border-radius:2px;
    background:linear-gradient(180deg,#c4dccb,#7ba086);
    box-shadow:0 0 6px rgba(155,190,165,.5);
    opacity:0;
  }
  .row.is-hover { background:rgba(255,255,255,.04); }
  .row.is-hover .jade-bar { opacity:1; }
  .row.is-hover span { color:#e8d9a0; text-shadow:0 0 12px rgba(212,160,90,.3), 0 1px 3px rgba(0,0,0,.55); }
  .row.is-hover img { opacity:1; filter:drop-shadow(0 0 4px rgba(212,160,90,.5)); }

  /* ============ 少侠立绘 ============ */
  .hero {
    position:absolute; left:50%; bottom:-66px; width:140px; height:140px;
    transform:translateX(-50%); overflow:hidden; z-index:6;
  }
  .hero img { width:560px; height:140px; display:block;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .hero-shadow {
    position:absolute; left:50%; bottom:-70px; width:126px; height:15px; z-index:5;
    transform:translateX(-50%);
    background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  }
</style>
</head>
<body>
<div class="stage">
  <!-- 夜山场景 -->
  <div class="scene">
    <div class="moon-glow"></div>
    <img class="gate" src="../game/src/assets/backgrounds/distant_gate_shadow.png" alt="">
    <img class="bamboo bl2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo br2" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo bl" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <img class="bamboo br" src="../game/src/assets/backgrounds/bamboo_edge_cluster.png" alt="">
    <div class="ground"></div>
    <div class="lamp-glow"></div>
    <img class="lantern" src="../game/src/assets/backgrounds/decor_lantern.png" alt="">
    <span class="firefly" style="left:112px; top:180px; opacity:.5"></span>
    <span class="firefly" style="left:88px; top:300px; opacity:.3"></span>
    <span class="firefly" style="left:158px; top:392px; opacity:.4"></span>
    <span class="firefly" style="right:130px; top:236px; opacity:.35"></span>
    <span class="firefly" style="right:96px; top:410px; opacity:.45"></span>
    <div class="shade"></div>
    <div class="vignette"></div>
  </div>

  <!-- 主面板 -->
  <div class="panel">
    <svg class="corner tl" viewBox="0 0 24 24"><path d="M1.5 22.5 V1.5 H22.5 M5.5 18.5 V5.5 H18.5 M9.5 14.5 V9.5 H14.5" fill="none" stroke="rgba(216,201,144,.7)" stroke-width="1.4"/></svg>
    <svg class="corner tr" viewBox="0 0 24 24"><path d="M1.5 22.5 V1.5 H22.5 M5.5 18.5 V5.5 H18.5 M9.5 14.5 V9.5 H14.5" fill="none" stroke="rgba(216,201,144,.7)" stroke-width="1.4"/></svg>
    <svg class="corner br" viewBox="0 0 24 24"><path d="M1.5 22.5 V1.5 H22.5 M5.5 18.5 V5.5 H18.5 M9.5 14.5 V9.5 H14.5" fill="none" stroke="rgba(216,201,144,.7)" stroke-width="1.4"/></svg>
    <svg class="corner bl" viewBox="0 0 24 24"><path d="M1.5 22.5 V1.5 H22.5 M5.5 18.5 V5.5 H18.5 M9.5 14.5 V9.5 H14.5" fill="none" stroke="rgba(216,201,144,.7)" stroke-width="1.4"/></svg>
    <i class="jade-pin"></i>
    <em class="side-tag">少侠</em>

    <header class="lintel">
      <span class="ll"></span>
      <h1>青石山道</h1>
      <i class="seal">侠</i>
      <span class="ll r"></span>
    </header>

    <section class="stats well">
      <div class="stat">
        <img src="../game/src/assets/ui/icon_coin.png" alt="">
        <div class="meta"><span class="lab">铜钱</span><span class="num">0</span></div>
      </div>
      <div class="stat">
        <img src="../game/src/assets/ui/icon_hourglass.png" alt="">
        <div class="meta"><span class="lab">最高存活</span><span class="num">0s</span></div>
      </div>
      <div class="stat">
        <img src="../game/src/assets/ui/icon_kill.png" alt="">
        <div class="meta"><span class="lab">最高击杀</span><span class="num">0</span></div>
      </div>
    </section>

    <img class="flourish" src="../game/src/assets/ui/divider_flourish.png" alt="">

    <nav class="rows">
      <div class="row is-hover">
        <i class="jade-bar"></i>
        <img src="../game/src/assets/ui/icon_sword.png" alt="">
        <span>开始闯荡</span>
      </div>
      <div class="row">
        <i class="jade-bar"></i>
        <img src="../game/src/assets/ui/icon_scroll.png" alt="">
        <span>翻阅秘籍</span>
      </div>
      <div class="row">
        <i class="jade-bar"></i>
        <img src="../game/src/assets/ui/icon_gear.png" alt="">
        <span>设置</span>
      </div>
    </nav>

    <div class="hero-shadow"></div>
    <div class="hero">
      <img src="../game/src/assets/sprites/hero_shaoxia_idle.png" alt="少侠">
    </div>
  </div>
</div>
</body>
</html>
